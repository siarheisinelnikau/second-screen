name: Check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Provision shared updater source
        shell: pwsh
        run: ./scripts/provision-shared-updater.ps1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -j 2 -- -D warnings
      - run: cargo test --locked -j 2
      - run: cargo clippy --locked --all-targets --features virtual-display -j 2 -- -D warnings
      - run: cargo test --locked --features virtual-display -j 2
      - run: ./scripts/test-driver-core.ps1
      - run: cargo test --locked --features virtual-display -j 2 decodes_actual_cpp_mailbox_fixture -- --ignored
      - run: node --test tests/viewer.test.cjs
      - run: ./scripts/package.ps1
      - run: python scripts/inspect_pe.py (Get-ChildItem dist -Filter 'SecondScreen-v*.exe' | Select-Object -First 1).FullName --output dist/verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: SecondScreen-windows-portable
          path: dist/
