[package]
name = "second-screen"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "A paired local-network desktop mirror with an embedded tablet viewer"
repository = "https://github.com/siarheisinelnikau/second-screen"

[dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
image = { version = "=0.25.10", default-features = false, features = ["jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
subtle = "2"
sha2 = "0.10"
semver = "1"
httparse = "1"
crossbeam-channel = "0.5"
ureq = "=3.5.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"

