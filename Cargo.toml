[package]
name = "second-screen"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "A paired local-network desktop mirror with an embedded tablet viewer"
repository = "https://github.com/siarheisinelnikau/second-screen"

[features]
default = []
virtual-display = []

[dependencies]
anyhow = "1"
egui = { version = "=0.33.3", default-features = false, features = ["default_fonts"] }
egui-winit = { version = "=0.33.3", default-features = false, features = ["clipboard", "links"] }
egui_software_backend = { version = "=0.0.2", default-features = false, features = ["std"] }
softbuffer = { version = "=0.4.8", default-features = false }
rust-auto-updator = { path = "../rust-auto-updator/crates/rust-auto-updator" }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
subtle = "2"
sha2 = "0.10"
httparse = "1"
crossbeam-channel = "0.5"
mio = { version = "1.2", features = ["os-poll", "net"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Devices_DeviceAndDriverInstallation", "Win32_System_IO"] }

[dev-dependencies]
tempfile = "3"
egui_software_backend = { version = "=0.0.2", default-features = false, features = ["std"] }
image = { version = "=0.25.10", default-features = false, features = ["png"] }

[profile.release]
lto = "thin"

[build-dependencies]
winresource = "=0.1.34"
